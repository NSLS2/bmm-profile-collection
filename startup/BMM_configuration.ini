[electrometers]
# make QuadEM available for use with ion chambers or other current measurements
quadem    = True
# have electron yield detector on line and using channel 4 of the QuadEM
iy        = False
# PIPS on channel 4 of the QuadEM
pips      = False
# PIN Diode for reflectivity experiments on channel 3 of QuadEM
diode     = False
# use integrated ion chamber #0 for I0, false means to use ch1 of the quadem
ic0       = True
# use integrated ion chamber #1 for It, false means to use ch2 of the quadem
ic1       = True
# use integrated ion chamber #2 for Ir, false means to use ch3 of the quadem
ic2       = True
# use dualem IC prototype (deprecated, almost certainly want this to be false)
dualem    = False

[electrometers.descriptions]
quadem = make QuadEM available for use with ion chambers or other current measurements
iy     = have electron yield detector on line and using channel 4 of the QuadEM
pips   = PIPS on channel 4 of the QuadEM
diode  = PIN Diode for reflectivity experiments on channel 3 of QuadEM
ic0    = use integrated ion chamber 0 for I0, false means to use ch1 of the quadem
ic1    = use integrated ion chamber 1 for It, false means to use ch2 of the quadem
ic2    = use integrated ion chamber 2 for Ir, false means to use ch3 of the quadem
dualem = use dualem IC prototype (deprecated, almost certainly want this to be false)


################################################################################


[sdd]
# use OG Struck system for fluorescence, deprecated and unlikely to function without effort
#struck     = False
# use the Xspress3X fluorescence readout system, almost certainly want this to be true
xspress3   = True
# specify which detector is the primary detector: 1- 4- or 7-element
primary    = 7
# use the 4 element detector
4element   = False
# use the 1 element detector
1element   = True
# use the 7 element detector
7element   = True

[sdd.descriptions]
xspress3   = use the Xspress3X fluorescence readout system, almost certainly want this to be true
primary    = specify which detector is the primary detector: 1- 4- or 7-element
4element   = set true to enable the 4 element detector
1element   = set true to enable the 1 element detector
7element   = set true to enable the 7 element detector


################################################################################



# detectors that are not ion chambers/electrometers nor SDDs
[detectors]
# use Pilatus 100K as an available detector
pilatus = False
# use Eiger2 4M as an available detector
eiger   = True
# use the DANTE at xf06bm-edxd1
dante   = False

[detectors.descriptions]
pilatus = set true to enable Pilatus 100K as an available detector
eiger   = set true to enable Eiger2 4M as an available detector
dante   = set true to enable Dante readout at xf06bm-edxd1 as an available detector


