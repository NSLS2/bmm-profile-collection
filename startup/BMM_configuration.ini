usb1   = set to true to record USB camera 1 (usb cameras are deprecated)
usb2   = set to true to record USB camera 2 (usb cameras are deprecated)


################################################################################



## special configuration as required for particular user experiments
[experiments]
# LakeShore 331 for use with Displex cryostat, typically offline when not in use
lakeshore      = False
# Linkam T96 controller, typically online even when not in use
linkam         = True
# AirScience enclosure for radiological experiments with sample XY inside enclosure
enclosure      = False
enclosure_x    = xafs_spare
enclosure_y    = xafs_refy

# when using the Displex, need to change the velocity and acceleration of xafs_y
displex        = False
# the University of Wisconsin molten salt furnace using the 1 element and Soller slit
# in these exps, it is helpful hint the potassium ROI for all channels
saltfurnace    = False
hint_potassium = False
# radiological samples on alternate reference wheel
#   0 = outer / 1 = inner
#   slot number
#   element symbol
#   chemical formula of reference
#   is present
radiological   = False
u_ref          = 1 1 U UO2(NO3)2.nH2O True
th_ref         = 1 14 Th Th(NO3)4 False
tc_ref         = 1 10 Tc TcO4 False
# synchronous multi-modal with CMS
cms            = True
# when using the reference stages for another purpose, set this to False
use_reference  = True
# True to process data or work on the ML model
use_larch      = False
# reflectivity configuration
it_in          = 67
it_out         = 107

[experiments.descriptions]
displex        = when using the Displex, need to change the velocity and acceleration of xafs_y
lakeshore      = LakeShore 331 for use with Displex cryostat, typically offline when not in use
linkam         = Linkam T96 controller, typically online even when not in use
enclosure      = AirScience enclosure for radiological experiments with sample XY inside enclosure
enclosure_x    = name of X axis motor inside enclosure
enclosure_y    = name of Y axis motor inside enclosure
saltfurnace    = the University of Wisconsin molten salt furnace using the 1 element and Soller slit
hint_potassium = in molten salt experiments it is helpful hint the potassium ROI for all channels
radiological   = radiological samples on alternate reference wheel, see xafs_ref.mapping
u_ref          = location and stoichiometry of U reference
th_ref         = location and stoichiometry of Th reference
tc_ref         = location and stoichiometry of Tc reference
cms            = set to true when doing a multi-modal experiment with CMS
use_reference  = set to false when using the reference stages for another purpose
use_larch      = set to true to process data or work on the ML model
it_in          = reflectivity configuration, position of It in beam
it_out         = reflectivity configuration, position of It out of beam



################################################################################


[services]
# The paths to the bmm and proposal folders
bmm         = /nsls2/data/bmm
proposals   = /nsls2/data/bmm/proposals
# NSLS-II API for information from PASS and about beamlines
# see BMM/user.py line 995
# dev site vs. stable site ??  Talk to Stuart C
pass_api    = https://api.nsls2.bnl.gov/v1/proposal
# The redis service where the content of RE.md is stored, i.e. current proposal number, current cycle, etc
#nsls2_redis = info.bmm.nsls2.bnl.gov   DEPRECATED
nsls2_redis = xf06bm-bmm-redis1.nsls2.bnl.gov
redis_port  = 6380
redis_ssl   = True
# database numbers for XAS RE.md, XRD RE.md, and storage of BMM state information
xas_redis   = 1
xrd_redis   = 2
bmm_redis   = 3
# The Kafka server and port number (see BMM/user_ns/base.py)
kafka       = kafka1.nsls2.bnl.gov:9092
# The Tiled server address for the writing client (see BMM/user_ns/base.py)
tiled       = https://tiled.nsls2.bnl.gov/api/v1/metadata/bmm/raw
# Queue Server (see BMM/agent_plans.py)
qs          = https://qserver.nsls2.bnl.gov/bmm
# location of profile
startup     = /nsls2/data/bmm/shared/config/bluesky/profile_collection/startup
# local workspace folder, user working folder goes underneath
workspace   = /home/xf06bm/Workspace
# location of API keys for http queue servers
qskeys      = /nsls2/data/bmm/shared/config/agent_runtime
# start the profile even if proposal folders are not available
# cameras & some detectors will be unavailable
proposal_folders_available = True

[services.descriptions]
bmm         = path to the NSF-mounted BMM data folder
proposals   = path to the BMM proposal folder
pass_api    = NSLS-II API for information from PASS and about beamlines
nsls2_redis = BMM redis server
redis_port  = BMM redis server port number
redis_ssl   = set to true to require ssl for redis
xas_redis   = redis database number for XAS RE.md
xrd_redis   = redis database number for XRD RE.md
bmm_redis   = redis database number for BMM state information
kafka       = kafka server and port number
tiled       = Tiled server for the writing client
qs          = Queue Server virtual machine address
startup     = profile location
workspace   = local workspace folder
qskeys      = location of API keys for http and queue servers
proposal_folders_available = set to false to start profile even if proposal folders are not available, cameras and some detectors will not be available




